name: Firestore Backup

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKUP_DIR: backup
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backup:
    name: Backup Firestore (Encrypted)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin

      - name: Generate backup filename
        shell: bash
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          echo "BACKUP_JSON=${BACKUP_DIR}/firestore-${TS}.json" >> $GITHUB_ENV
          echo "BACKUP_GZ=${BACKUP_DIR}/firestore-${TS}.json.gz" >> $GITHUB_ENV
          echo "BACKUP_ENC=${BACKUP_DIR}/firestore-${TS}.json.gz.enc" >> $GITHUB_ENV

      - name: Export Firestore data
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/firestore-backup.mjs --out="$BACKUP_JSON"

      - name: Compress backup
        shell: bash
        run: gzip -9 "${BACKUP_JSON}"

      - name: Encrypt backup
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          if [ -z "${BACKUP_ENCRYPTION_PASSPHRASE}" ]; then
            echo "Missing secret BACKUP_ENCRYPTION_PASSPHRASE"
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "${BACKUP_GZ}" \
            -out "${BACKUP_ENC}" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE

      - name: Upload encrypted backup (7 days retention)
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backup-${{ github.run_id }}
          path: backup/*.enc
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup local backup files
        if: always()
        shell: bash
        run: rm -rf "${BACKUP_DIR}"
