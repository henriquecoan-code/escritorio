<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Importar Dados → Firestore</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #e0e0e0; }
    h2 { color: #7ec8e3; }
    button { padding: 8px 18px; margin: 6px 4px; cursor: pointer; border-radius: 6px; border: none; font-size: 14px; }
    #btnImport  { background: #27ae60; color: #fff; }
    #btnImport:disabled { background: #555; }
    #btnRenum   { background: #2980b9; color: #fff; }
    #btnRenum:disabled  { background: #555; }
    #btnExport  { background: #8e44ad; color: #fff; }
    #btnExport:disabled { background: #555; }
    input, select { background: #2a2a4a; color: #e0e0e0; border: 1px solid #444; padding: 6px 10px; border-radius: 4px; margin: 4px; }
    #log { background: #0d0d1a; border: 1px solid #333; padding: 14px; height: 380px; overflow-y: auto;
           white-space: pre-wrap; font-size: 12px; border-radius: 6px; margin-top: 12px; }
    .ok  { color: #2ecc71; }
    .err { color: #e74c3c; }
    .inf { color: #3498db; }
    .warn{ color: #f39c12; }
    .bar { background: #2a2a4a; border-radius: 8px; height: 18px; margin: 8px 0; overflow: hidden; }
    .bar-inner { height: 100%; background: #27ae60; transition: width 0.3s; }
    label { font-size: 13px; }
  </style>
</head>
<body>
<h2>Ferramentas Firestore — Oliveira &amp; Benedet</h2>

<div>
  <label>Email: <input type="email" id="email" placeholder="seu@email.com"></label>
  <label>Senha: <input type="password" id="senha" placeholder="senha"></label>
  <button id="btnLogin" onclick="doLogin()">Login</button>
  <span id="userStatus" style="color:#888; font-size:13px;"></span>
</div>

<div style="margin-top:12px;">
  <label>Arquivo (JSON ou Excel):
    <input type="file" id="fileInput" accept=".json,.xlsx,.xls">
  </label>
</div>

<div style="margin-top:8px;">
  <label>
    <input type="checkbox" id="chkSkipExisting" checked>
    Pular registros que já existem no Firestore (recomendado)
  </label>
</div>

<div style="margin-top:6px;">
  <label>Registros existentes:
    <select id="existingMode">
      <option value="fillMissing" selected>Completar apenas campos faltantes (padrão)</option>
      <option value="mergeProvided">Atualizar todos os campos presentes no arquivo (seguro)</option>
      <option value="replaceAll">Substituir documento pelos dados do arquivo</option>
    </select>
  </label>
</div>

<div style="margin-top:10px;">
  <button id="btnExport" onclick="exportarFirestore()" disabled>⬇ Exportar backup (Excel)</button>
  <button id="btnImport" onclick="startImport()" disabled>▶ Importar</button>
  <button id="btnRenum"  onclick="renumerar()" disabled>🔢 Renumerar registros (1, 2, 3...)</button>
</div>

<div class="bar"><div class="bar-inner" id="progress" style="width:0%"></div></div>
<div id="status" style="font-size:13px; color:#aaa;">—</div>
<div id="log"></div>

<!-- SheetJS para exportação Excel -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.public.js"></script>

<script>
// ── Init Firebase ──────────────────────────────────────────────
if (!firebase.apps.length) {
  firebase.initializeApp(window.OB_FIREBASE_CONFIG);
}
const auth = firebase.auth();
const db   = firebase.firestore();

// ── Logging ────────────────────────────────────────────────────
function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = cls || '';
  line.textContent = '[' + new Date().toLocaleTimeString('pt-BR') + '] ' + msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function nowIso() {
  return new Date().toISOString();
}

async function requireReauth(actionLabel) {
  const user = auth.currentUser;
  if (!user || !user.email) {
    log('Sessão inválida. Faça login novamente.', 'err');
    return false;
  }

  const email = prompt('Confirme o usuário para ' + actionLabel + ':', user.email);
  if (!email) {
    log('Ação cancelada: usuário não informado.', 'warn');
    return false;
  }

  const senha = prompt('Confirme a senha para ' + actionLabel + ':');
  if (!senha) {
    log('Ação cancelada: senha não informada.', 'warn');
    return false;
  }

  try {
    const cred = firebase.auth.EmailAuthProvider.credential(email.trim(), senha);
    await user.reauthenticateWithCredential(cred);
    return true;
  } catch (e) {
    log('Falha na reautenticação para ' + actionLabel + ': ' + e.message, 'err');
    return false;
  }
}

async function appendAuditEvent(action, details) {
  const user = auth.currentUser;
  if (!user) return;

  const ref = db.collection('meta').doc('importAudit');
  const event = {
    at: nowIso(),
    action,
    uid: user.uid,
    email: user.email || '',
    details: details || {}
  };

  await db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    const current = snap.exists && Array.isArray(snap.data().events) ? snap.data().events : [];
    const next = current.concat([event]).slice(-300);
    tx.set(ref, { events: next, updatedAt: nowIso() }, { merge: true });
  });
}

// ── Auth ───────────────────────────────────────────────────────
auth.onAuthStateChanged(async user => {
  const st = document.getElementById('userStatus');
  if (user) {
    // Habilita ações básicas para qualquer autenticado
    document.getElementById('btnExport').disabled = false;
    document.getElementById('btnImport').disabled = false;

    // Verifica se é admin (UID em meta/security.adminUids)
    let isAdmin = false;
    try {
      const metaSnap = await db.collection('meta').doc('security').get();
      if (metaSnap.exists) {
        const adminUids = metaSnap.data().adminUids || [];
        isAdmin = adminUids.includes(user.uid);
      }
    } catch(e) {
      log('Aviso: não foi possível verificar permissões de admin — ' + e.message, 'warn');
    }

    if (isAdmin) {
      st.textContent = '✓ ' + user.email + ' (admin)';
      st.style.color = '#2ecc71';
      document.getElementById('btnRenum').disabled = false;
    } else {
      st.textContent = '✓ ' + user.email;
      st.style.color = '#f39c12';
      document.getElementById('btnRenum').disabled = true;
      log('Acesso limitado: Renumerar exige permissão de admin.', 'warn');
    }
  } else {
    st.textContent = 'Não autenticado';
    st.style.color = '#e74c3c';
    document.getElementById('btnExport').disabled = true;
    document.getElementById('btnImport').disabled = true;
    document.getElementById('btnRenum').disabled  = true;
  }
});

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  if (!email || !senha) { log('Preencha email e senha.', 'err'); return; }
  try {
    await auth.signInWithEmailAndPassword(email, senha);
    log('Login OK!', 'ok');
  } catch(e) {
    log('Erro login: ' + e.message, 'err');
  }
}

// ── Import ─────────────────────────────────────────────────────
// Mapeamento cabeçalho Excel (pt) → chave interna
const EXCEL_MAP = {
  'Nº':               'numero',
  'Data':             'data',
  'Mês':              'mes',
  'Cliente':          'cliente',
  'Área':             'area',
  'Ação':             'acao',
  'Tipo':             'tipo',
  'Origem':           'origem',
  'Advogado':         'adv',
  'Status':           'status',
  'Etapa':            'etapa',
  'Dt. Chegada':      'dtChegada',
  'Dt. Contato':      'dtContato',
  'Dt. Envio Contr.': 'dtEnvioContrato',
  'Dt. Assinatura':   'dtAssinatura',
  'Dt. Docs':         'dtDocs',
  'Dt. Docs Rec.':    'dtDocsRec',
  'Dt. Entrega':      'dtEntrega',
  'Docs Pendentes':   'docsPendentes',
  'Obs':              'obs',
  'UID':              'uid',
};

async function lerArquivo(file) {
  const nome = file.name.toLowerCase();
  if (nome.endsWith('.json')) {
    const raw = await file.text();
    let records;
    try { records = JSON.parse(raw); } catch(e) { throw new Error('JSON inválido: ' + e.message); }
    if (!Array.isArray(records)) throw new Error('O arquivo não é um array JSON.');
    return records;
  }
  if (nome.endsWith('.xlsx') || nome.endsWith('.xls')) {
    const buf = await file.arrayBuffer();
    const wb  = XLSX.read(buf, { type: 'array' });
    const ws  = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
    return rows.map(row => {
      const rec = {};
      for (const [col, chave] of Object.entries(EXCEL_MAP)) {
        if (row[col] !== undefined) {
          let v = row[col];
          // docsPendentes: string separada por vírgula → array
          if (chave === 'docsPendentes') {
            v = v ? String(v).split(',').map(s => s.trim()).filter(Boolean) : [];
          }
          // etapa e numero: garantir número
          if ((chave === 'etapa' || chave === 'numero') && v !== '') v = Number(v);
          rec[chave] = v;
        }
      }
      return rec;
    });
  }
  throw new Error('Formato não suportado. Use .json ou .xlsx');
}

function buildPatchFromRecord(rec) {
  const patch = {};
  for (const [k, v] of Object.entries(rec)) {
    if (k === 'uid' || v === undefined) continue;
    patch[k] = v;
  }
  if (Object.prototype.hasOwnProperty.call(patch, 'docsPendentes') && !Array.isArray(patch.docsPendentes)) {
    patch.docsPendentes = [];
  }
  return patch;
}

async function startImport() {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) { log('Selecione um arquivo .json ou .xlsx.', 'warn'); return; }

  if (!(await requireReauth('importação'))) return;

  const skipExisting = document.getElementById('chkSkipExisting').checked;
  const existingMode = document.getElementById('existingMode').value;
  let records;
  try { records = await lerArquivo(fileInput.files[0]); } catch(e) { log(e.message, 'err'); return; }

  if (!Array.isArray(records) || !records.length) { log('Nenhum registro encontrado no arquivo.', 'err'); return; }
  if (skipExisting && existingMode !== 'fillMissing') {
    log('A opção "Pular registros" está marcada; modo para existentes ignorado.', 'warn');
  }
  log('Iniciando importação de ' + records.length + ' registros (' + fileInput.files[0].name + ')...', 'inf');

  const coll = db.collection('contratos');
  let ok = 0, skipped = 0, errs = 0;

  for (let i = 0; i < records.length; i++) {
    const rec = records[i];
    if (!rec.uid) { log('Registro #' + i + ' sem uid — pulando.', 'warn'); skipped++; continue; }

    // Progresso
    const pct = Math.round(((i + 1) / records.length) * 100);
    document.getElementById('progress').style.width = pct + '%';
    document.getElementById('status').textContent = (i + 1) + ' / ' + records.length + ' (' + pct + '%)';

    try {
      const docRef = coll.doc(rec.uid);
      const snap = await docRef.get();

      if (snap.exists) {
        if (skipExisting) {
          // Merge apenas novos campos (não sobrescreve dados já preenchidos)
          const existing = snap.data();
          const patch = {};
          const newFields = ['etapa','dtChegada','dtContato','dtEnvioContrato',
                             'dtAssinatura','dtDocs','dtDocsRec','dtEntrega','docsPendentes'];
          for (const f of newFields) {
            if ((existing[f] === undefined || existing[f] === null) && rec[f] !== undefined) {
              patch[f] = rec[f];
            }
          }
          if (Object.keys(patch).length) {
            await docRef.update(patch);
            log('Atualizado (campos faltantes): ' + rec.uid + ' | ' + (rec.cliente || ''), 'inf');
          } else {
            log('Sem mudanças: ' + rec.uid + ' | ' + (rec.cliente || ''), 'warn');
          }
          skipped++;
          continue;
        }

        if (existingMode === 'mergeProvided') {
          const patch = buildPatchFromRecord(rec);
          if (Object.keys(patch).length) {
            await docRef.update(patch);
            log('Atualizado (modo seguro): ' + rec.uid + ' | ' + (rec.cliente || ''), 'inf');
          } else {
            log('Sem campos para atualizar: ' + rec.uid + ' | ' + (rec.cliente || ''), 'warn');
          }
          skipped++;
          continue;
        }

        if (existingMode === 'replaceAll') {
          const payload = { ...rec };
          if (!Array.isArray(payload.docsPendentes)) payload.docsPendentes = [];
          await docRef.set(payload);
          log('Substituído: ' + rec.uid + ' | ' + (rec.cliente || ''), 'warn');
          skipped++;
          continue;
        }
      }

      // Cria novo documento
      const payload = { ...rec };
      // Garante que docsPendentes seja array
      if (!Array.isArray(payload.docsPendentes)) payload.docsPendentes = [];
      await docRef.set(payload);
      log('Criado: ' + rec.uid + ' | ' + (rec.cliente || ''), 'ok');
      ok++;

    } catch(e) {
      log('ERRO uid=' + rec.uid + ': ' + e.message, 'err');
      errs++;
    }

    // Pequena pausa para não sobrecarregar o Firestore (burst limit)
    if ((i + 1) % 20 === 0) await sleep(500);
  }

  log('─────────────────────────', 'inf');
  log('Concluído! Criados: ' + ok + ' | Pulados/atualizados: ' + skipped + ' | Erros: ' + errs, ok && !errs ? 'ok' : 'warn');
  document.getElementById('status').textContent = 'Concluído — ' + ok + ' criados, ' + skipped + ' pulados, ' + errs + ' erros.';

  try {
    await appendAuditEvent('import', {
      file: fileInput.files[0]?.name || '',
      existingMode,
      skipExisting,
      created: ok,
      touched: skipped,
      errors: errs,
      total: records.length
    });
  } catch (e) {
    log('Aviso: falha ao gravar histórico da importação: ' + e.message, 'warn');
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Exportar backup ───────────────────────────────────────────
async function exportarFirestore() {
  if (!(await requireReauth('exportação'))) return;

  log('Carregando todos os registros para exportar...', 'inf');
  document.getElementById('progress').style.width = '0%';
  document.getElementById('status').textContent = 'Exportando...';

  try {
    const snap = await db.collection('contratos').get();
    if (snap.empty) { log('Nenhum registro encontrado.', 'warn'); return; }

    const records = snap.docs.map(d => d.data());

    // Ordena por numero se disponível, senão por data
    records.sort((a, b) => {
      if (a.numero && b.numero) return a.numero - b.numero;
      return (a.data || '').localeCompare(b.data || '');
    });

    // Monta linhas com colunas legíveis em português
    const colunas = [
      { key: 'numero',            label: 'Nº'              },
      { key: 'data',              label: 'Data'            },
      { key: 'mes',               label: 'Mês'             },
      { key: 'cliente',           label: 'Cliente'         },
      { key: 'area',              label: 'Área'            },
      { key: 'acao',              label: 'Ação'            },
      { key: 'tipo',              label: 'Tipo'            },
      { key: 'origem',            label: 'Origem'          },
      { key: 'adv',               label: 'Advogado'        },
      { key: 'status',            label: 'Status'          },
      { key: 'etapa',             label: 'Etapa'           },
      { key: 'dtChegada',         label: 'Dt. Chegada'     },
      { key: 'dtContato',         label: 'Dt. Contato'     },
      { key: 'dtEnvioContrato',   label: 'Dt. Envio Contr.'},
      { key: 'dtAssinatura',      label: 'Dt. Assinatura'  },
      { key: 'dtDocs',            label: 'Dt. Docs'        },
      { key: 'dtDocsRec',         label: 'Dt. Docs Rec.'   },
      { key: 'dtEntrega',         label: 'Dt. Entrega'     },
      { key: 'docsPendentes',     label: 'Docs Pendentes'  },
      { key: 'obs',               label: 'Obs'             },
      { key: 'uid',               label: 'UID'             },
    ];

    const rows = records.map(r => {
      const row = {};
      colunas.forEach(c => {
        let v = r[c.key];
        if (Array.isArray(v)) v = v.join(', ');
        row[c.label] = (v === undefined || v === null) ? '' : v;
      });
      return row;
    });

    const ws = XLSX.utils.json_to_sheet(rows, { header: colunas.map(c => c.label) });

    // Largura das colunas
    ws['!cols'] = colunas.map(c => ({ wch: Math.max(c.label.length + 2, 14) }));

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Contratos');

    const now = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
    XLSX.writeFile(wb, `backup-contratos-${now}.xlsx`);

    document.getElementById('progress').style.width = '100%';
    document.getElementById('status').textContent = `Exportado — ${records.length} registros.`;
    log(`Backup gerado com ${records.length} registros → backup-contratos-${now}.xlsx`, 'ok');

    try {
      await appendAuditEvent('export', {
        file: `backup-contratos-${now}.xlsx`,
        total: records.length
      });
    } catch (e) {
      log('Aviso: falha ao gravar histórico da exportação: ' + e.message, 'warn');
    }
  } catch(e) {
    log('Erro ao exportar: ' + e.message, 'err');
  }
}

// ── Renumerar registros ────────────────────────────────────────
async function renumerar() {
  if (!(await requireReauth('renumeração'))) return;

  if (!confirm('Isso vai atribuir um número sequencial (campo "numero") a TODOS os registros,\nordenados do mais antigo ao mais recente (campo "data").\n\nContinuar?')) return;

  log('Carregando todos os registros...', 'inf');
  const snap = await db.collection('contratos').get();
  if (snap.empty) { log('Nenhum registro encontrado.', 'warn'); return; }

  // Ordena por data (dd/mm/yyyy → yyyy-mm-dd para comparação) e uid como desempate
  function toISO(dmy) {
    if (!dmy) return '';
    const p = dmy.split('/');
    return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : dmy;
  }

  const docs = snap.docs.map(d => ({ ref: d.ref, data: d.data() }));
  docs.sort((a, b) => {
    const da = toISO(a.data.data), db2 = toISO(b.data.data);
    if (da < db2) return -1;
    if (da > db2) return 1;
    return (a.data.uid || '').localeCompare(b.data.uid || '');
  });

  log(`${docs.length} registros encontrados. Iniciando renumeração...`, 'inf');
  document.getElementById('progress').style.width = '0%';

  const BATCH_SIZE = 400; // Firestore batch limit = 500 writes
  let num = 1;
  for (let i = 0; i < docs.length; i += BATCH_SIZE) {
    const batch = db.batch();
    const slice = docs.slice(i, i + BATCH_SIZE);
    for (const item of slice) {
      batch.update(item.ref, { numero: num++ });
    }
    await batch.commit();
    const pct = Math.round((Math.min(i + BATCH_SIZE, docs.length) / docs.length) * 100);
    document.getElementById('progress').style.width = pct + '%';
    document.getElementById('status').textContent = `Renumerados: ${Math.min(i + BATCH_SIZE, docs.length)} / ${docs.length}`;
    log(`Lote salvo: registros ${i + 1}–${Math.min(i + BATCH_SIZE, docs.length)}`, 'ok');
    if (i + BATCH_SIZE < docs.length) await sleep(300);
  }

  log('─────────────────────────', 'inf');
  log(`Renumeração concluída! ${docs.length} registros numerados de 1 a ${docs.length}.`, 'ok');
  document.getElementById('status').textContent = `Concluído — ${docs.length} registros renumerados.`;

  try {
    await appendAuditEvent('renumber', {
      total: docs.length
    });
  } catch (e) {
    log('Aviso: falha ao gravar histórico da renumeração: ' + e.message, 'warn');
  }
}
</script>
</body>
</html>
